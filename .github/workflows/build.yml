name: build

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (plug-in ${{ matrix.year }})
    runs-on: windows-latest
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        year: ["2024", "2025", "2026", "2027"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A Navisworks plug-in must compile against the API of the release it runs in;
      # the per-year reference assemblies are restored from NuGet (see BIMCamel.csproj).
      - name: Build plug-in (Release, Navisworks ${{ matrix.year }})
        run: dotnet build BIMCamel/BIMCamel.csproj -c Release -p:NavisworksYear=${{ matrix.year }}

      # The host adapters compile per year for the same reason the plug-in does: they are written
      # against that year's API. CamelWorks.Nav.Clash is built separately and deliberately — it is
      # the only thing that touches Autodesk.Navisworks.Clash.dll, which ships with Manage and not
      # with Simulate.
      - name: Build CamelWorks.Nav (Release, Navisworks ${{ matrix.year }})
        run: dotnet build CamelWorks/CamelWorks.Nav/CamelWorks.Nav.csproj -c Release -p:NavisworksYear=${{ matrix.year }}

      - name: Build CamelWorks.Nav.Clash (Release, Navisworks ${{ matrix.year }})
        run: dotnet build CamelWorks/CamelWorks.Nav.Clash/CamelWorks.Nav.Clash.csproj -c Release -p:NavisworksYear=${{ matrix.year }}

      - name: Build CamelWorks.UI (Release, Navisworks ${{ matrix.year }})
        run: dotnet build CamelWorks/CamelWorks.UI/CamelWorks.UI.csproj -c Release -p:NavisworksYear=${{ matrix.year }}

  installer:
    name: Windows (installer)
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Payload-less compile check; the release workflow embeds the real bundle.
      - name: Build installer (Release)
        run: dotnet build installer/BIMCamel.Installer/BIMCamel.Installer.csproj -c Release

  # CamelWorks.Core is netstandard2.0 with no Autodesk references, so it builds AND its tests run
  # on Linux — no Navisworks, no Windows runner. That is the point of the seam: the logic four host
  # years have to share is verified on every push, while the host-bound assemblies only compile.
  core:
    name: Linux (CamelWorks.Core + tests)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build CamelWorks.Core (Release)
        run: dotnet build CamelWorks/CamelWorks.Core/CamelWorks.Core.csproj -c Release

      - name: Test CamelWorks.Core
        run: dotnet test CamelWorks/CamelWorks.Core.Tests/CamelWorks.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      # Unit tests cannot prove a BCF file is valid. It can be well-formed, round-trip through our
      # own reader, pass every assertion, and still be rejected by the receiving tool for a missing
      # element. The test run writes the real output; xmllint checks it against the published
      # buildingSMART XSDs. This is what caught BCF 3.0's required AspectRatio.
      - name: Validate written BCF against the published schemas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils qpdf
          CamelWorks/schemas/bcf/validate.sh

      # Same reasoning for PDF. Assertions over the bytes prove the writer did what it meant to and
      # prove nothing about whether a reader will accept the result; qpdf walks the object graph
      # and the cross-reference table.
      - name: Check written PDFs are structurally sound
        run: CamelWorks/checks/validate-pdf.sh

      # A ribbon command lives in three places — the markup that draws it, the attribute that
      # registers it, and the catalogue that routes it — and nothing in the compiler connects them.
      # A button in two of the three either does nothing, never appears, or cannot be found by
      # search, and each looks like a different bug.
      - name: Check the ribbon, the plug-in and the catalogue agree
        run: python3 CamelWorks/checks/validate-ribbon.py
